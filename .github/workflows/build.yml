name: Compilar NTVDMx64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Activar compilador MSVC (Visual Studio)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Preparar carpeta C:\bld y código fuente
        run: |
          New-Item -ItemType Directory -Force -Path C:\bld | Out-Null
          New-Item -ItemType Directory -Force -Path C:\src | Out-Null
          Copy-Item -Path ".\*" -Destination "C:\src" -Recurse -Force
          
          $autobuildDir = Get-ChildItem -Path "C:\src" -Recurse -Directory -Filter "autobuild" | Select-Object -First 1
          Copy-Item -Path "$($autobuildDir.FullName)\*" -Destination "C:\bld" -Recurse -Force
        shell: pwsh

      - name: Compilar NTVDMx64 (CCPU Release)
        run: |
          Set-Location C:\bld
          $ntvdmPatchDir = (Get-ChildItem -Path "C:\src" -Recurse -Directory -Filter "ntvdmpatch" | Select-Object -First 1).FullName
          Write-Host "Usando SRCDIR = $ntvdmPatchDir"
          
          # Dejar que el script oficial use dwnl.exe para bajar todas las dependencias reales
          cmd /c "set SRCDIR=$ntvdmPatchDir && (echo. & echo. & echo.) | autobuild-ccpu-fre.cmd > C:\bld\build.log 2>&1"
          
          Write-Host "=== ULTIMAS 40 LINEAS DEL LOG DE COMPILACION ==="
          Get-Content C:\bld\build.log | Where-Object { $_ -notmatch "byte\(s\) downloaded\)" } | Select-Object -Last 40
          Write-Host "=== ARCHIVOS Y CARPETAS GENERADOS EN C:\bld ==="
          Get-ChildItem -Path C:\bld
        shell: pwsh

      - name: Empaquetar resultado
        uses: actions/upload-artifact@v4
        with:
          name: NTVDMx64-Compilado
          path: |
            C:\bld\build.log
            C:\bld\releases\**
            C:\bld\**\*ntvdmx64*.zip
            C:\bld\**\*ntvdmx64*.7z
