name: Compilar NTVDMx64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar autobuild oficial más reciente
        run: |
          New-Item -ItemType Directory -Force -Path C:\bld | Out-Null
          Set-Location C:\bld
          
          # Obtener la primera publicación disponible (incluyendo pre-releases)
          $releases = Invoke-RestMethod -Uri "https://github.com"
          $asset = $releases[0].assets | Where-Object { $_.name -match "\.(zip|7z)$" } | Select-Object -First 1
          
          if (-not $asset) {
            Write-Error "No se encontro ningun archivo descargable en Releases."
            exit 1
          }

          Write-Host "Descargando: $($asset.browser_download_url)"
          curl.exe -f -L -o "$($asset.name)" "$($asset.browser_download_url)"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          if ($asset.name -like "*.zip") {
            Expand-Archive -Path "$($asset.name)" -DestinationPath "C:\bld" -Force
          } else {
            7z x "$($asset.name)" -o"C:\bld" -y
          }
          Remove-Item "$($asset.name)"
        shell: pwsh

      - name: Descargar dependencias base (MinNT y old-src)
        run: |
          Set-Location C:\bld
          
          Write-Host "Descargando MinNT..."
          curl.exe -f -L -o "MinNT-20170416-85fac4faadc77203db8ddc66af280a75c1b717b0.zip" "https://archive.org"
          if ($LASTEXITCODE -ne 0) { Write-Error "Fallo al descargar MinNT"; exit 1 }

          Write-Host "Descargando old-src..."
          curl.exe -f -L -o "old-src.trunk.r687.20150728.7z" "https://archive.org"
          if ($LASTEXITCODE -ne 0) { Write-Error "Fallo al descargar old-src"; exit 1 }
        shell: pwsh

      - name: Compilar NTVDMx64 (CCPU Release)
        run: |
          Set-Location C:\bld
          Get-ChildItem
          cmd /c autobuild-ccpu-fre.cmd
        shell: pwsh

      - name: Empaquetar resultado
        uses: actions/upload-artifact@v4
        with:
          name: NTVDMx64-Compilado
          path: C:\bld\releases\
