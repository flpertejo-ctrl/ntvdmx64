name: Compilar NTVDMx64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Activar compilador MSVC (Visual Studio)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Preparar C:\bld y descargar MinNT / old-src
        run: |
          New-Item -ItemType Directory -Force -Path C:\bld | Out-Null
          New-Item -ItemType Directory -Force -Path C:\src | Out-Null
          Copy-Item -Path ".\*" -Destination "C:\src" -Recurse -Force
          
          $autobuildDir = Get-ChildItem -Path "C:\src" -Recurse -Directory -Filter "autobuild" | Select-Object -First 1
          Copy-Item -Path "$($autobuildDir.FullName)\*" -Destination "C:\bld" -Recurse -Force
          
          Set-Location C:\bld
          $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          $ref = "https://malwarewatch.org"

          Write-Host "Descargando MinNT..."
          curl.exe -s -f -L -A "$ua" -e "$ref" -o "MinNT-20170416-85fac4faadc77203db8ddc66af280a75c1b717b0.zip" "https://www.cita-soft.com/v1/MinNt-2017.zip"
          
          Write-Host "Descargando old-src..."
          curl.exe -s -f -L -A "$ua" -e "$ref" -o "old-src.trunk.r687.20150728.7z" "www.cita-soft.com/v1/old-src.trunk.7z"

          # Comprobar que ambos archivos pesan mas de 10 MB (no son paginas de error)
          $minNtSize = (Get-Item "MinNT-20170416-85fac4faadc77203db8ddc66af280a75c1b717b0.zip").Length
          $oldSrcSize = (Get-Item "old-src.trunk.r687.20150728.7z").Length
          Write-Host "Tamano MinNT: $minNtSize bytes | Tamano old-src: $oldSrcSize bytes"
          if ($minNtSize -lt 10000000 -or $oldSrcSize -lt 10000000) {
            Write-Error "Uno de los archivos descargados es demasiado pequeno (bloqueo del servidor)."
            exit 1
          }
        shell: pwsh

      - name: Compilar NTVDMx64 (CCPU Release)
        run: |
          Set-Location C:\bld
          $ntvdmPatchDir = (Get-ChildItem -Path "C:\src" -Recurse -Directory -Filter "ntvdmpatch" | Select-Object -First 1).FullName
          Write-Host "Usando SRCDIR = $ntvdmPatchDir"
          
          cmd /c "set SRCDIR=$ntvdmPatchDir && (echo. & echo. & echo. & echo. & echo.) | autobuild-ccpu-fre.cmd > C:\bld\build.log 2>&1"
          
          Write-Host "=== ULTIMAS 40 LINEAS DEL LOG DE COMPILACION ==="
          Get-Content C:\bld\build.log | Where-Object { $_ -notmatch "byte\(s\) downloaded\)" } | Select-Object -Last 40
          Write-Host "=== ARCHIVOS Y CARPETAS GENERADOS EN C:\bld ==="
          Get-ChildItem -Path C:\bld
        shell: pwsh

      - name: Empaquetar resultado
        uses: actions/upload-artifact@v4
        with:
          name: NTVDMx64-Compilado
          path: |
            C:\bld\build.log
            C:\bld\releases\**
            C:\bld\**\*ntvdmx64*.zip
            C:\bld\**\*ntvdmx64*.7z
