name: Compilar NTVDMx64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Activar compilador MSVC (Visual Studio)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Preparar carpeta C:\bld
        run: |
          New-Item -ItemType Directory -Force -Path C:\bld | Out-Null
          $autobuildDir = Get-ChildItem -Path . -Recurse -Directory -Filter "autobuild" | Select-Object -First 1
          Copy-Item -Path "$($autobuildDir.FullName)\*" -Destination "C:\bld" -Recurse -Force
        shell: pwsh

      - name: Descargar dependencias base (MinNT y old-src)
        run: |
          Set-Location C:\bld
          curl.exe -f -L -o "MinNT-20170416-85fac4faadc77203db8ddc66af280a75c1b717b0.zip" "https://archive.org"
          curl.exe -f -L -o "old-src.trunk.r687.20150728.7z" "https://archive.org"
        shell: pwsh

      - name: Compilar NTVDMx64 (CCPU Release)
        run: |
          Set-Location C:\bld
          cmd /c "echo. | autobuild-ccpu-fre.cmd"
          Write-Host "=== ARCHIVOS GENERADOS EN C:\bld ==="
          Get-ChildItem -Path C:\bld -Recurse -Depth 2
        shell: pwsh

      - name: Empaquetar resultado
        uses: actions/upload-artifact@v4
        with:
          name: NTVDMx64-Compilado
          path: |
            C:\bld\**\*.zip
            C:\bld\releases\**
            !C:\bld\MinNT-*.zip
