name: Compilar NTVDMx64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Activar compilador MSVC (Visual Studio)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Preparar carpeta C:\bld y descargar dependencias
        run: |
          New-Item -ItemType Directory -Force -Path C:\bld | Out-Null
          $autobuildDir = Get-ChildItem -Path . -Recurse -Directory -Filter "autobuild" | Select-Object -First 1
          Copy-Item -Path "$($autobuildDir.FullName)\*" -Destination "C:\bld" -Recurse -Force
          
          Set-Location C:\bld
          Write-Host "Descargando GRMWDK_EN_7600_1.ISO..."
          curl.exe -s -f -L -o "GRMWDK_EN_7600_1.ISO" "https://microsoft.com"
          
          Write-Host "Descargando GRMSDK_EN_DVD.iso..."
          curl.exe -s -f -L -o "GRMSDK_EN_DVD.iso" "https://download.microsoft.com/download/F/1/0/F10113F5-B750-4969-A255-274341AC6BCE/GRMSDK_EN_DVD.iso"

          Write-Host "Descargando MinNT..."
          curl.exe -s -f -L -o "MinNT-20170416-85fac4faadc77203db8ddc66af280a75c1b717b0.zip" "https://archive.org"
          
          Write-Host "Descargando old-src..."
          curl.exe -s -f -L -o "old-src.trunk.r687.20150728.7z" "https://archive.org"
        shell: pwsh

      - name: Compilar NTVDMx64 (CCPU Release)
        run: |
          Set-Location C:\bld
          cmd /c "echo. | autobuild-ccpu-fre.cmd > C:\bld\build.log 2>&1"
          Write-Host "=== ULTIMAS 40 LINEAS LIMPIAS ==="
          Get-Content C:\bld\build.log -Tail 40 | ForEach-Object { $_ -replace '[^\x20-\x7E]', '' }
          Write-Host "=== ARCHIVOS Y CARPETAS EN C:\bld ==="
          Get-ChildItem -Path C:\bld
        shell: pwsh

      - name: Empaquetar resultado
        uses: actions/upload-artifact@v4
        with:
          name: NTVDMx64-Compilado
          path: |
            C:\bld\releases\**
            C:\bld\**\*ntvdmx64*.zip
            C:\bld\**\*ntvdmx64*.7z
