name: Compilar NTVDMx64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Ejecutar Autobuild (MINNT)
        run: |
          cd ntvdmpatch\autobuild
          cmd /c autobuild-ccpu-fre.cmd
        shell: pwsh

      - name: Empaquetar resultado
        uses: actions/upload-artifact@v4
        with:
          name: NTVDMx64-Compilado
          path: ntvdmpatch/autobuild/release/
