name: Compilar NTVDMx64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar scripts autobuild desde master
        run: |
          New-Item -ItemType Directory -Force -Path C:\bld | Out-Null
          New-Item -ItemType Directory -Force -Path C:\tmp_repo | Out-Null
          Set-Location C:\tmp_repo
          
          Write-Host "Descargando repositorio master de leecher1337..."
          curl.exe -f -L -o master.zip "https://github.com"
          if ($LASTEXITCODE -ne 0) { Write-Error "Fallo al descargar master.zip"; exit 1 }
          
          Expand-Archive -Path "master.zip" -DestinationPath "C:\tmp_repo" -Force
          
          # Buscar la carpeta autobuild dentro del codigo descargado y copiar sus archivos a C:\bld
          $autobuildDir = Get-ChildItem -Path "C:\tmp_repo" -Recurse -Directory -Filter "autobuild" | Select-Object -First 1
          if (-not $autobuildDir) { Write-Error "No se encontro la carpeta autobuild"; exit 1 }
          
          Copy-Item -Path "$($autobuildDir.FullName)\*" -Destination "C:\bld" -Recurse -Force
          Remove-Item -Path "C:\tmp_repo" -Recurse -Force
        shell: pwsh

      - name: Descargar dependencias base (MinNT y old-src)
        run: |
          Set-Location C:\bld
          
          Write-Host "Descargando MinNT..."
          curl.exe -f -L -o "MinNT-20170416-85fac4faadc77203db8ddc66af280a75c1b717b0.zip" "https://archive.org"
          if ($LASTEXITCODE -ne 0) { Write-Error "Fallo al descargar MinNT"; exit 1 }

          Write-Host "Descargando old-src..."
          curl.exe -f -L -o "old-src.trunk.r687.20150728.7z" "https://archive.org"
          if ($LASTEXITCODE -ne 0) { Write-Error "Fallo al descargar old-src"; exit 1 }
        shell: pwsh

      - name: Compilar NTVDMx64 (CCPU Release)
        run: |
          Set-Location C:\bld
          Get-ChildItem
          cmd /c autobuild-ccpu-fre.cmd
        shell: pwsh

      - name: Empaquetar resultado
        uses: actions/upload-artifact@v4
        with:
          name: NTVDMx64-Compilado
          path: C:\bld\releases\
