name: Compilar NTVDMx64 (Solo ES)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Activar compilador MSVC (Visual Studio)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Preparar C:\bld y descargar desde tu web
        run: |
          New-Item -ItemType Directory -Force -Path C:\bld | Out-Null
          New-Item -ItemType Directory -Force -Path C:\src | Out-Null
          Copy-Item -Path ".\*" -Destination "C:\src" -Recurse -Force
          
          $autobuildDir = Get-ChildItem -Path "C:\src" -Recurse -Directory -Filter "autobuild" | Select-Object -First 1
          Copy-Item -Path "$($autobuildDir.FullName)\*" -Destination "C:\bld" -Recurse -Force
          
          Set-Location C:\bld
          
          curl.exe -s -S -f -L -o "MinNT-20170416-85fac4faadc77203db8ddc66af280a75c1b717b0.zip" "https://cita-soft.com/v0/ntv/MinNT.zip"
          if ($LASTEXITCODE -ne 0) { Write-Error "Fallo al descargar MinNT de la web"; exit 1 }

          curl.exe -s -S -f -L -o "old-src.trunk.r687.20150728.7z" "https://cita-soft.com/v0/ntv/old-src.7z"
          if ($LASTEXITCODE -ne 0) { Write-Error "Fallo al descargar old-src de la web"; exit 1 }
        shell: pwsh

      - name: Compilar NTVDMx64 (CCPU Release)
        run: |
          Set-Location C:\bld
          $ntvdmPatchDir = (Get-ChildItem -Path "C:\src" -Recurse -Directory -Filter "ntvdmpatch" | Select-Object -First 1).FullName
          Write-Host "Usando SRCDIR = $ntvdmPatchDir"
          
          1..100 | ForEach-Object { "Y" } | Out-File -FilePath C:\bld\keys.txt -Encoding ascii
          
          cmd /c "set SRCDIR=$ntvdmPatchDir && autobuild-ccpu-fre.cmd < C:\bld\keys.txt 2>&1" | ForEach-Object {
            if ($_ -notmatch "byte\(s\) downloaded\)") {
              Write-Host $_
            }
          }
        shell: pwsh

      - name: Filtrar carpeta ES e insertar DOS y WOW32
        run: |
          Set-Location C:\bld
          
          curl.exe -s -S -f -L -o "dos.zip" "https://cita-soft.com/v0/ntv/dos.zip"
          if ($LASTEXITCODE -ne 0) { Write-Error "Fallo al descargar dos.zip de la web"; exit 1 }

          curl.exe -s -S -f -L -o "wow32.zip" "https://cita-soft.com/v0/ntv/wow32.zip"
          if ($LASTEXITCODE -ne 0) { Write-Error "Fallo al descargar wow32.zip de la web"; exit 1 }

          # Localizar el archivo comprimido generado por autobuild (excluyendo los descargados)
          $paquete = Get-ChildItem -Path "C:\bld" -Recurse -File | Where-Object {
            ($_.Extension -eq ".7z" -or $_.Extension -eq ".zip") -and
            $_.Name -notlike "MinNT*" -and
            $_.Name -notlike "old-src*" -and
            $_.Name -ne "dos.zip" -and
            $_.Name -ne "wow32.zip"
          } | Sort-Object Length -Descending | Select-Object -First 1
          
          if ($paquete) {
            Write-Host "Procesando paquete encontrado: $($paquete.FullName)..."
            New-Item -ItemType Directory -Force -Path "C:\bld\temp_pkg" | Out-Null
            7z x "$($paquete.FullName)" -o"C:\bld\temp_pkg" -y | Out-Null

            # Dejar unicamente la carpeta 'es'
            $esDir = Get-ChildItem -Path "C:\bld\temp_pkg" -Recurse -Directory -Filter "es" | Select-Object -First 1
            
            if ($esDir) {
              $parentDir = $esDir.Parent.FullName
              Write-Host "Eliminando otros idiomas en $parentDir..."
              Get-ChildItem -Path $parentDir -Directory | Where-Object { $_.Name -ne "es" } | Remove-Item -Recurse -Force
              $baseDir = $esDir.FullName
            } else {
              $installBat = Get-ChildItem -Path "C:\bld\temp_pkg" -Recurse -Filter "install.bat" | Select-Object -First 1
              $baseDir = if ($installBat) { $installBat.DirectoryName } else { "C:\bld\temp_pkg" }
            }

            Write-Host "Insertando DOS y WOW32 en: $baseDir"
            $dosDir = Join-Path $baseDir "dos"
            $wowDir = Join-Path $baseDir "wow32"
            New-Item -ItemType Directory -Force -Path $dosDir | Out-Null
            New-Item -ItemType Directory -Force -Path $wowDir | Out-Null

            Expand-Archive -Path "C:\bld\dos.zip" -DestinationPath $dosDir -Force
            Expand-Archive -Path "C:\bld\wow32.zip" -DestinationPath $wowDir -Force

            # Reempaquetar rapido (-mx=1) para no sobrecargar la CPU al final
            Remove-Item -Path $paquete.FullName -Force
            Set-Location "C:\bld\temp_pkg"
            7z a -mx=1 "$($paquete.FullName)" * | Out-Null
          } else {
            Write-Host "Contenido actual de C:\bld tras compilar:"
            Get-ChildItem -Path "C:\bld" -Recurse | Select-Object FullName
            Write-Error "No se encontro ningun archivo comprimido generado por autobuild."
            exit 1
          }
        shell: pwsh

      - name: Empaquetar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NTVDMx64-ES-Compilado
          path: |
            C:\bld\releases\**
            C:\bld\**\*ntvdmx64*.zip
            C:\bld\**\*ntvdmx64*.7z
