name: Compilar NTVDMx64 (Solo ES)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Activar compilador MSVC (Visual Studio)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Preparar C:\bld y descargar desde tu web
        run: |
          New-Item -ItemType Directory -Force -Path C:\bld | Out-Null
          New-Item -ItemType Directory -Force -Path C:\src | Out-Null
          Copy-Item -Path ".\*" -Destination "C:\src" -Recurse -Force
          
          $autobuildDir = Get-ChildItem -Path "C:\src" -Recurse -Directory -Filter "autobuild" | Select-Object -First 1
          Copy-Item -Path "$($autobuildDir.FullName)\*" -Destination "C:\bld" -Recurse -Force
          
          Set-Location C:\bld
          
          curl.exe -s -S -f -L -o "MinNT-20170416-85fac4faadc77203db8ddc66af280a75c1b717b0.zip" "www.//cita-soft.com/v0/ntv/MinNT.zip"
          if ($LASTEXITCODE -ne 0) { Write-Error "Fallo al descargar MinNT de la web"; exit 1 }

          curl.exe -s -S -f -L -o "old-src.trunk.r687.20150728.7z" "www.//cita-soft.com/v0/ntv/old-src.7z"
          if ($LASTEXITCODE -ne 0) { Write-Error "Fallo al descargar old-src de la web"; exit 1 }
        shell: pwsh

      - name: Compilar NTVDMx64 (CCPU Release)
        run: |
          Set-Location C:\bld
          $ntvdmPatchDir = (Get-ChildItem -Path "C:\src" -Recurse -Directory -Filter "ntvdmpatch" | Select-Object -First 1).FullName
          Write-Host "Usando SRCDIR = $ntvdmPatchDir"
          
          1..100 | ForEach-Object { "Y" } | Out-File -FilePath C:\bld\keys.txt -Encoding ascii
          
          cmd /c "set SRCDIR=$ntvdmPatchDir && autobuild-ccpu-fre.cmd < C:\bld\keys.txt 2>&1" | ForEach-Object {
            if ($_ -notmatch "byte\(s\) downloaded\)") {
              Write-Host $_
            }
          }
        shell: pwsh

      - name: Limpiar idiomas y añadir DOS y WOW32 en ES
        run: |
          Set-Location C:\bld
          
          curl.exe -s -S -f -L -o "dos.zip" "www.//cita-soft.com/v0/ntv/dos.zip"
          if ($LASTEXITCODE -ne 0) { Write-Error "Fallo al descargar dos.zip de la web"; exit 1 }

          curl.exe -s -S -f -L -o "wow32.zip" "www.//cita-soft.com/v0/ntv/wow32,zip"
          if ($LASTEXITCODE -ne 0) { Write-Error "Fallo al descargar wow32.zip de la web"; exit 1 }

          $esDir = Get-ChildItem -Path "C:\bld\releases" -Recurse -Directory -Filter "es" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $esDir) {
            $esDir = Get-ChildItem -Path "C:\bld" -Recurse -Directory -Filter "es" | Where-Object { $_.FullName -notlike "C:\src*" } | Select-Object -First 1
          }

          if (-not $esDir) {
            Write-Error "No se encontro la carpeta 'es' tras la compilacion."
            exit 1
          }

          Write-Host "Carpeta ES encontrada en: $($esDir.FullName)"

          $parentDir = $esDir.Parent.FullName
          Get-ChildItem -Path $parentDir -Directory | Where-Object { $_.Name -ne "es" } | ForEach-Object {
            Write-Host "Eliminando idioma sobrante: $($_.Name)"
            Remove-Item -Path $_.FullName -Recurse -Force
          }

          $dosDir = Join-Path $esDir.FullName "dos"
          $wowDir = Join-Path $esDir.FullName "wow32"
          New-Item -ItemType Directory -Force -Path $dosDir | Out-Null
          New-Item -ItemType Directory -Force -Path $wowDir | Out-Null

          Expand-Archive -Path "C:\bld\dos.zip" -DestinationPath $dosDir -Force
          Expand-Archive -Path "C:\bld\wow32.zip" -DestinationPath $wowDir -Force

          New-Item -ItemType Directory -Force -Path "C:\bld\resultado_final\es" | Out-Null
          Copy-Item -Path "$($esDir.FullName)\*" -Destination "C:\bld\resultado_final\es" -Recurse -Force
          Write-Host "Estructura final preparada en C:\bld\resultado_final\es"
        shell: pwsh

      - name: Empaquetar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NTVDMx64-ES-Compilado
          path: C:\bld\resultado_final\**
